name: keep-server-alive

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: keep-server-alive
      cancel-in-progress: false
    steps:
      - name: Start codespace
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          gh codespace start -c mc-lab-cs1-69q969jxvxp4h5p7r >/dev/null 2>&1 || true
          echo "codespace start requested"

      - name: Ensure stack on codespace
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if gh codespace ssh -c mc-lab-cs1-69q969jxvxp4h5p7r -- bash /workspaces/tests/.keepalive/ensure_stack.sh; then
              echo "stack ensured (attempt $i)"
              break
            fi
            echo "attempt $i failed, waiting 15s"
            sleep 15
          done
          echo "keep-alive cycle complete"
